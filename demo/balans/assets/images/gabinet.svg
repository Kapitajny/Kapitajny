  <path d="M468 846l-6 40M662 846l6 40" stroke="#A98463" stroke-width="8" stroke-linecap="round"/>
  <rect x="450" y="560" width="230" height="232" rx="62" fill="#2B3D57"/>
  <rect x="440" y="790" width="250" height="60" rx="20" fill="#24354D"/>
  <rect x="440" y="736" width="250" height="72" rx="26" fill="#34496A"/>
  <rect x="422" y="690" width="50" height="152" rx="25" fill="#24354D"/>
  <rect x="658" y="690" width="50" height="152" rx="25" fill="#24354D"/>
  <rect x="566" y="652" width="88" height="80" rx="20" fill="#E4C8A8" transform="rotate(-9 610 692)"/>
