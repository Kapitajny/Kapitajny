<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t d">
  <title id="t">Ilustracja: spokojne wnętrze gabinetu konsultacyjnego</title>
  <desc id="d">Jasny gabinet z łukowym oknem, granatowym fotelem, stolikiem z rośliną i lampą stojącą. Grafika poglądowa do zastąpienia fotografią.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4EBE6"/><stop offset="1" stop-color="#F6F1E9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6E8" stop-opacity=".9"/><stop offset="1" stop-color="#FFF6E8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="glass"><path d="M120 700V310a160 160 0 0 1 320 0v390z"/></clipPath>
  </defs>
  <rect width="800" height="1000" fill="#F1E9DE"/>
  <rect y="780" width="800" height="220" fill="#E7DACA"/>
  <rect y="774" width="800" height="8" fill="#DECDB8"/>
  <!-- okno -->
  <path d="M106 712V310a174 174 0 0 1 348 0v402z" fill="#FBF8F3"/>
  <path d="M120 700V310a160 160 0 0 1 320 0v390z" fill="url(#sky)"/>
  <g clip-path="url(#glass)">
    <path d="M100 610c70-40 150-52 230-30s110 18 130 8v130H100z" fill="#C9D6CE"/>
    <path d="M100 650c90-30 170-20 240 4s90 10 120 0v60H100z" fill="#A9BDB1"/>
  </g>
  <path d="M280 150v550M120 430h320M120 580h320" stroke="#FBF8F3" stroke-width="8"/>
  <rect x="94" y="700" width="372" height="16" rx="3" fill="#FBF8F3"/>
  <!-- światło na podłodze -->
  <path d="M140 790h300l150 190H200z" fill="#FFFDF8" opacity=".38"/>
  <!-- obraz -->
  <circle cx="610" cy="300" r="74" fill="#F8F4EE" stroke="#DCCAB5" stroke-width="6"/>
  <path d="M566 296a44 44 0 0 1 88 0z" fill="#B7C7BD"/>
  <path d="M566 304a44 44 0 0 0 88 0z" fill="#EAD5BD"/>
  <path d="M548 300h124" stroke="#D4AE88" stroke-width="1.5"/>
  <!-- dywan -->
  <ellipse cx="470" cy="890" rx="280" ry="52" fill="#DECBB4"/>
  <ellipse cx="470" cy="890" rx="250" ry="40" fill="none" stroke="#E9DAC6" stroke-width="3"/>
  <!-- stolik z rośliną -->
  <path d="M360 762v108" stroke="#A98463" stroke-width="6"/>
  <ellipse cx="360" cy="874" rx="30" ry="6" fill="#A98463"/>
  <ellipse cx="360" cy="760" rx="52" ry="11" fill="#C8A37F"/>
  <g fill="#7E9A8B">
    <ellipse cx="342" cy="660" rx="12" ry="34" transform="rotate(-28 342 660)"/>
    <ellipse cx="378" cy="652" rx="12" ry="36" transform="rotate(24 378 652)"/>
    <ellipse cx="360" cy="636" rx="11" ry="38"/>
  </g>
  <g fill="#95AB9F">
    <ellipse cx="326" cy="690" rx="10" ry="28" transform="rotate(-55 326 690)"/>
    <ellipse cx="394" cy="688" rx="10" ry="28" transform="rotate(55 394 688)"/>
  </g>
  <path d="M338 700h44l-6 52h-32z" fill="#F7F2EA" stroke="#DCCAB5" stroke-width="2"/>
